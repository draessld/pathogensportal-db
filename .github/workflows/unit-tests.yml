name: "CI: Unit Tests"

# Unit testy — JEN na PR do `main`.
on:
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run pytest
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "Žádný adresář tests/ nenalezen, testy se přeskakují."
          fi
